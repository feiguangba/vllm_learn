# wiki_plan.yaml — VLLM_learn/docs 架构文档计划
# 依据: vendor/vllm (vLLM v0.23.0 dev/main, commit 967e104)
# 路径约定: 文档中 `文件:行号` 相对 vendor/vllm/vllm/ 包根目录

repo: vendor/vllm
version: v0.23.0-dev (main @ 967e104)

wiki:
  - id: 01
    file: 01_system_architecture.md
    title: vLLM V1 系统架构:多进程拓扑与事件循环
    status: done
    sources:
      - vllm/v1/engine/core.py          # EngineCore 事件循环 / run_busy_loop
      - vllm/v1/engine/core_client.py   # 前端↔引擎 ZMQ 客户端族
      - vllm/v1/engine/llm_engine.py    # LLMEngine 主进程封装
      - vllm/v1/engine/async_llm.py     # AsyncLLM 异步接口
      - vllm/v1/executor/multiproc_executor.py  # 多进程 Worker 执行器
      - vllm/v1/worker/gpu_worker.py    # GPU Worker
    highlights:
      - 三层进程模型: 前端 / EngineCore / Worker
      - ZMQ + shm_broadcast + torch.multiprocessing 三通道
      - run_busy_loop 事件循环与请求旅程

  - id: 02
    file: 02_PagedAttention_KVCache.md
    title: PagedAttention 与 KV Cache 管理
    status: done
    sources:
      - vllm/v1/core/block_pool.py            # BlockPool / BlockHashToBlockMap
      - vllm/v1/core/kv_cache_manager.py      # KVCacheManager
      - vllm/v1/core/single_type_kv_cache_manager.py
      - vllm/v1/core/kv_cache_utils.py        # KVCacheBlock / 哈希 / 容量
      - vllm/v1/core/kv_cache_coordinator.py  # 多组协调
      - vllm/v1/kv_cache_interface.py         # KV cache spec 类型
      - vllm/config/cache.py                  # DEFAULT_BLOCK_SIZE=16
      - vllm/v1/worker/gpu_worker.py          # determine_available_memory
    highlights:
      - 16-token 块 / 物理虚拟映射 / refcount 回收
      - 容量公式: available // page_size // group_size
      - 链式哈希前缀缓存 + COW

  - id: 03
    file: 03_Scheduler.md
    title: V1 调度器:token 预算与连续批处理
    status: done
    sources:
      - vllm/v1/core/sched/scheduler.py       # schedule / 抢占 / update_from_output
      - vllm/v1/core/sched/interface.py       # SchedulerInterface / PauseState
      - vllm/v1/core/sched/request_queue.py   # SchedulingPolicy
      - vllm/v1/core/sched/output.py          # SchedulerOutput
      - vllm/v1/request.py                    # RequestStatus
    highlights:
      - 无独立 prefill/decode 阶段, 按 token 预算调度
      - recompute 抢占 + last_sched_seq 延迟释放
      - 连续批处理与请求生命周期

