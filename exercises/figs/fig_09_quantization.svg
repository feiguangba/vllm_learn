<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.45"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1400" height="900" fill="#FFFFFF"/>

  <text x="48" y="52" font-size="20" font-weight="bold" fill="#1E293B">量化 Quantization：低位宽折叠与三条技术路线</text>

  <!-- ============ 左：量化映射原理 ============ -->
  <rect x="80" y="80" width="560" height="700" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="104" y="110" font-size="14" font-weight="bold" fill="#475569">量化映射原理</text>

  <text x="310" y="146" font-size="12" fill="#475569" text-anchor="middle">FP32 权重分布</text>
  <line x1="150" y1="296" x2="470" y2="296" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M 170,296 C 230,120 390,120 450,296" fill="none" stroke="#64748B" stroke-width="2"/>
  <line x1="170" y1="296" x2="170" y2="306" stroke="#64748B" stroke-width="2"/>
  <line x1="450" y1="296" x2="450" y2="306" stroke="#64748B" stroke-width="2"/>
  <text x="170" y="322" font-size="10" fill="#475569" text-anchor="middle">min</text>
  <text x="450" y="322" font-size="10" fill="#475569" text-anchor="middle">max</text>

  <path d="M 170,314 C 150,350 150,380 170,402" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>
  <path d="M 450,314 C 470,350 470,380 450,402" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="310" y="368" font-size="11" fill="#2563EB" text-anchor="middle">仿射映射（scale s · zero-point z）</text>

  <line x1="170" y1="410" x2="450" y2="410" stroke="#7C3AED" stroke-width="3"/>
  <line x1="170" y1="404" x2="170" y2="416" stroke="#7C3AED" stroke-width="2"/>
  <line x1="310" y1="404" x2="310" y2="416" stroke="#7C3AED" stroke-width="2"/>
  <line x1="450" y1="404" x2="450" y2="416" stroke="#7C3AED" stroke-width="2"/>
  <text x="170" y="432" font-size="10" fill="#7C3AED" text-anchor="middle">-128</text>
  <text x="310" y="432" font-size="10" fill="#7C3AED" text-anchor="middle">0</text>
  <text x="450" y="432" font-size="10" fill="#7C3AED" text-anchor="middle">127</text>
  <circle cx="180" cy="398" r="2.5" fill="#7C3AED"/>
  <circle cx="198" cy="398" r="2.5" fill="#7C3AED"/>
  <circle cx="216" cy="398" r="2.5" fill="#7C3AED"/>
  <circle cx="234" cy="398" r="2.5" fill="#7C3AED"/>
  <circle cx="252" cy="398" r="2.5" fill="#7C3AED"/>
  <circle cx="270" cy="398" r="2.5" fill="#7C3AED"/>
  <circle cx="288" cy="398" r="2.5" fill="#7C3AED"/>
  <circle cx="306" cy="398" r="2.5" fill="#7C3AED"/>
  <circle cx="324" cy="398" r="2.5" fill="#7C3AED"/>
  <circle cx="342" cy="398" r="2.5" fill="#7C3AED"/>
  <circle cx="360" cy="398" r="2.5" fill="#7C3AED"/>
  <circle cx="378" cy="398" r="2.5" fill="#7C3AED"/>
  <circle cx="396" cy="398" r="2.5" fill="#7C3AED"/>
  <circle cx="414" cy="398" r="2.5" fill="#7C3AED"/>
  <circle cx="432" cy="398" r="2.5" fill="#7C3AED"/>
  <text x="470" y="402" font-size="10" fill="#7C3AED">INT8 离散网格</text>

  <g filter="url(#glow)">
    <rect x="140" y="470" width="440" height="110" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  </g>
  <text x="160" y="504" font-size="12" fill="#1E293B" font-family="Consolas, monospace">x_q = clip(round(x / s) + z, -128, 127)</text>
  <text x="160" y="530" font-size="12" fill="#1E293B" font-family="Consolas, monospace">x̂ = s · (x_q − z)</text>
  <text x="160" y="558" font-size="11" fill="#475569" font-family="Consolas, monospace">s = (max−min)/255    z = −round(min/s)</text>

  <text x="140" y="624" font-size="12" fill="#475569">FP32 → INT8：显存 ÷4，精度损失需可控</text>
  <text x="140" y="652" font-size="11" fill="#94A3B8">对称量化 z=0；非对称量化带 zero-point 处理偏斜分布</text>

  <!-- ============ 右：三条技术路线 ============ -->
  <rect x="680" y="80" width="640" height="700" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="704" y="110" font-size="14" font-weight="bold" fill="#475569">三条技术路线</text>

  <!-- GPTQ -->
  <rect x="720" y="130" width="560" height="170" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="744" y="162" font-size="16" font-weight="bold" fill="#1E293B">GPTQ</text>
  <rect x="744" y="176" width="210" height="22" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="849" y="191" font-size="10" fill="#1E293B" text-anchor="middle">训练后量化 PTQ · 4bit 优先</text>
  <text x="744" y="228" font-size="12" fill="#1E293B">逐列量化 + Hessian 误差补偿：把当前列的量化误差</text>
  <text x="744" y="250" font-size="12" fill="#1E293B">按最优方向转嫁给未量化列，使重构误差最小</text>
  <text x="744" y="282" font-size="11" fill="#475569">显存 ÷4 · 精度损失最小的经典方案</text>

  <!-- AWQ -->
  <g filter="url(#glow)">
    <rect x="720" y="330" width="560" height="170" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  </g>
  <text x="744" y="362" font-size="16" font-weight="bold" fill="#1E293B">AWQ</text>
  <rect x="744" y="376" width="190" height="22" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
  <text x="839" y="391" font-size="10" fill="#1E293B" text-anchor="middle">激活感知 · 保护关键通道</text>
  <text x="744" y="428" font-size="12" fill="#1E293B">激活幅值大的 ~1% 关键权重通道按 per-channel 缩放</text>
  <text x="744" y="450" font-size="12" fill="#1E293B">保护；只量化不重要的权重，精度几乎无损</text>
  <text x="744" y="482" font-size="11" fill="#475569">适合 W4A16 边缘与端侧部署</text>

  <!-- FP8 -->
  <rect x="720" y="530" width="560" height="170" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="744" y="562" font-size="16" font-weight="bold" fill="#1E293B">FP8 浮点量化</text>
  <rect x="744" y="576" width="130" height="22" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
  <text x="809" y="591" font-size="10" fill="#1E293B" text-anchor="middle">E4M3 / E5M2</text>
  <text x="744" y="628" font-size="12" fill="#1E293B">8bit 浮点格式：E4M3 存权重与激活，E5M2 动态范围更大</text>
  <text x="744" y="650" font-size="12" fill="#1E293B">硬件原生支持，前向直接低精度计算，无需反量化</text>
  <text x="744" y="682" font-size="11" fill="#475569">KV Cache 显存减半 · 新一代加速卡原生加速</text>

  <text x="48" y="876" font-size="11" fill="#94A3B8">量化的本质：用 scale / zero-point 把高精度权重折叠进低位宽；GPTQ 补误差、AWQ 挑通道、FP8 靠硬件</text>
</svg>
