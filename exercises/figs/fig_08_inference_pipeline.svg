<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.45"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1400" height="800" fill="#FFFFFF"/>

  <text x="48" y="52" font-size="20" font-weight="bold" fill="#1E293B">一次推理请求的端到端流水线</text>

  <!-- 主路径大箭头（画在模块后面） -->
  <line x1="80" y1="405" x2="1330" y2="405" stroke="#F59E0B" stroke-width="4" marker-end="url(#arrO)"/>
  <text x="1338" y="436" font-size="11" fill="#F59E0B" text-anchor="end">→ 用户</text>

  <!-- 步骤编号 -->
  <text x="165" y="326" font-size="12" fill="#94A3B8" text-anchor="middle">①</text>
  <text x="340" y="326" font-size="12" fill="#94A3B8" text-anchor="middle">②</text>
  <text x="535" y="326" font-size="12" fill="#94A3B8" text-anchor="middle">③</text>
  <text x="770" y="326" font-size="12" fill="#94A3B8" text-anchor="middle">④</text>
  <text x="995" y="326" font-size="12" fill="#94A3B8" text-anchor="middle">⑤</text>
  <text x="1210" y="326" font-size="12" fill="#94A3B8" text-anchor="middle">⑥</text>

  <!-- ① Prompt -->
  <rect x="90" y="340" width="150" height="130" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="165" y="398" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">Prompt 文本</text>
  <text x="165" y="424" font-size="11" fill="#475569" text-anchor="middle">用户输入</text>

  <!-- ② Tokenizer -->
  <rect x="265" y="340" width="150" height="130" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="340" y="398" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">Tokenizer</text>
  <text x="340" y="424" font-size="11" fill="#475569" text-anchor="middle">文本 → token ids</text>

  <!-- ③ 元数据组装 -->
  <rect x="440" y="340" width="190" height="130" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="535" y="366" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">元数据组装</text>
  <rect x="460" y="378" width="150" height="20" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="535" y="392" font-size="10" fill="#1E293B" text-anchor="middle">input_ids</text>
  <rect x="460" y="402" width="150" height="20" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="535" y="416" font-size="10" fill="#1E293B" text-anchor="middle">positions</text>
  <rect x="460" y="426" width="150" height="20" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="535" y="440" font-size="10" fill="#1E293B" text-anchor="middle">slot_mapping</text>

  <!-- ④ Model Forward -->
  <g filter="url(#glow)">
    <rect x="655" y="340" width="230" height="130" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  </g>
  <text x="770" y="366" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">Model Forward</text>
  <rect x="675" y="378" width="190" height="22" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
  <text x="770" y="393" font-size="10" fill="#1E293B" text-anchor="middle">Embedding [B,T,d]</text>
  <rect x="675" y="406" width="190" height="22" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
  <text x="770" y="421" font-size="10" fill="#1E293B" text-anchor="middle">N × Decoder Blocks</text>
  <rect x="675" y="434" width="190" height="22" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
  <text x="770" y="449" font-size="10" fill="#1E293B" text-anchor="middle">lm_head → logits</text>

  <!-- ⑤ Sampler -->
  <rect x="910" y="340" width="170" height="130" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="995" y="398" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">Sampler</text>
  <text x="995" y="422" font-size="10" fill="#475569" text-anchor="middle">temperature / top-p</text>
  <text x="995" y="438" font-size="10" fill="#475569" text-anchor="middle">penalties</text>

  <!-- ⑥ Detokenizer + SSE -->
  <rect x="1105" y="340" width="210" height="130" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="1210" y="392" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">Detokenizer</text>
  <text x="1210" y="416" font-size="12" fill="#1E293B" text-anchor="middle">SSE 流式输出</text>
  <text x="1210" y="436" font-size="11" fill="#475569" text-anchor="middle">增量解码</text>

  <!-- KV Cache 旁路 -->
  <rect x="655" y="580" width="230" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="770" y="616" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">KV Cache</text>
  <text x="770" y="640" font-size="11" fill="#475569" text-anchor="middle">PagedAttention 分页</text>
  <text x="770" y="658" font-size="10" fill="#475569" text-anchor="middle">物理块 0..N · ref_count</text>
  <line x1="700" y1="474" x2="700" y2="576" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrP)"/>
  <text x="690" y="530" font-size="11" fill="#7C3AED" text-anchor="end">写入 K/V</text>
  <line x1="840" y1="576" x2="840" y2="474" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrP)"/>
  <text x="852" y="530" font-size="11" fill="#7C3AED">读取</text>

  <!-- 关键字注释 -->
  <text x="165" y="500" font-size="12" fill="#94A3B8" text-anchor="middle">原始文本</text>
  <text x="340" y="500" font-size="12" fill="#94A3B8" text-anchor="middle">离散化</text>
  <text x="535" y="500" font-size="12" fill="#94A3B8" text-anchor="middle">对齐引擎输入</text>
  <text x="770" y="500" font-size="12" fill="#94A3B8" text-anchor="middle">算 logits</text>
  <text x="995" y="500" font-size="12" fill="#94A3B8" text-anchor="middle">选下一个词</text>
  <text x="1210" y="500" font-size="12" fill="#94A3B8" text-anchor="middle">ids → 文本流</text>

  <text x="48" y="740" font-size="11" fill="#94A3B8">文本进、token 流出：Sampler 决定「选哪个词」，KV Cache 决定「算得多快」——两者共同构成一次解码步</text>
</svg>
