  <rect x="1200" y="267" width="14" height="14" fill="#FFFFFF" stroke="#94A3B8"/>
  <rect x="1220" y="267" width="14" height="14" fill="#FFFFFF" stroke="#94A3B8"/>
  <!-- 物理 4 -->
  <rect x="980" y="306" width="280" height="48" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="996" y="336" font-size="12" fill="#1E293B">物理块 4</text>
  <rect x="1160" y="323" width="14" height="14" fill="#7C3AED"/>
  <rect x="1180" y="323" width="14" height="14" fill="#7C3AED"/>
  <rect x="1200" y="323" width="14" height="14" fill="#7C3AED"/>
  <rect x="1220" y="323" width="14" height="14" fill="#7C3AED"/>
  <!-- 物理 11 -->
  <rect x="980" y="362" width="280" height="48" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="996" y="392" font-size="12" fill="#1E293B">物理块 11</text>
  <rect x="1160" y="379" width="14" height="14" fill="#7C3AED"/>
  <rect x="1180" y="379" width="14" height="14" fill="#FFFFFF" stroke="#94A3B8"/>
  <rect x="1200" y="379" width="14" height="14" fill="#FFFFFF" stroke="#94A3B8"/>
  <rect x="1220" y="379" width="14" height="14" fill="#FFFFFF" stroke="#94A3B8"/>
  <!-- 物理 13 -->
  <rect x="980" y="418" width="280" height="48" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="996" y="448" font-size="12" fill="#1E293B">物理块 13</text>
  <rect x="1160" y="435" width="14" height="14" fill="#7C3AED"/>
