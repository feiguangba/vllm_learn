  <rect x="1220" y="547" width="14" height="14" fill="#7C3AED"/>
  <!-- 物理 8 -->
  <rect x="980" y="586" width="280" height="48" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="996" y="616" font-size="12" fill="#1E293B">物理块 8</text>
  <rect x="1160" y="603" width="14" height="14" fill="#FFFFFF" stroke="#94A3B8"/>
  <rect x="1180" y="603" width="14" height="14" fill="#FFFFFF" stroke="#94A3B8"/>
  <rect x="1200" y="603" width="14" height="14" fill="#FFFFFF" stroke="#94A3B8"/>
  <rect x="1220" y="603" width="14" height="14" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="960" y="676" font-size="10" fill="#64748B">每物理块 16 slot（图中示意 4 格）；白格 = free</text>

  <!-- ============ 映射箭头 ============ -->
  <path d="M 380,154 C 450,154 460,166 516,166" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>
  <path d="M 784,166 L 868,166 L 868,148 L 952,148" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>
  <path d="M 380,502 C 440,502 460,420 516,420" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrO)"/>
  <path d="M 784,420 L 930,420 L 930,162 L 952,162" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrO)"/>
  <text x="922" y="400" font-size="11" fill="#F59E0B" text-anchor="end">前缀共享</text>

  <text x="48" y="782" font-size="11" fill="#94A3B8">PagedAttention 按固定大小块分配 KV：逻辑连续、物理离散、按需取用，内外碎片趋近于零；相同前缀块跨请求共享</text>
</svg>
