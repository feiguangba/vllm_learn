  <rect x="1200" y="435" width="14" height="14" fill="#FFFFFF" stroke="#94A3B8"/>
  <rect x="1220" y="435" width="14" height="14" fill="#FFFFFF" stroke="#94A3B8"/>
  <!-- 物理 5 -->
  <rect x="980" y="474" width="280" height="48" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="996" y="504" font-size="12" fill="#1E293B">物理块 5</text>
  <rect x="1160" y="491" width="14" height="14" fill="#7C3AED"/>
  <rect x="1180" y="491" width="14" height="14" fill="#7C3AED"/>
