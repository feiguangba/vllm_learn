<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.45"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#F1F5F9"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#CBD5E1" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1400" height="900" fill="#FFFFFF"/>

  <text x="48" y="52" font-size="20" font-weight="bold" fill="#1E293B">分布式并行四维度：DP / TP / PP / EP</text>

  <!-- ============ Q1 TP ============ -->
  <rect x="90" y="90" width="590" height="370" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="114" y="122" font-size="15" font-weight="bold" fill="#1E293B">张量并行 TP（Tensor Parallel）</text>
  <text x="656" y="122" font-size="11" fill="#475569" text-anchor="end">层内切分 · 通信密集</text>

  <rect x="150" y="150" width="160" height="110" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <line x1="230" y1="150" x2="230" y2="260" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="230" y="143" font-size="11" fill="#475569" text-anchor="middle">权重 W 竖切</text>
  <line x1="190" y1="264" x2="186" y2="294" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="270" y1="264" x2="274" y2="294" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>

  <rect x="110" y="300" width="150" height="90" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="185" y="338" font-size="12" font-weight="bold" fill="#1E293B" text-anchor="middle">GPU 0</text>
  <text x="185" y="360" font-size="10" fill="#475569" text-anchor="middle">W 左半 · 算一半</text>
  <rect x="290" y="300" width="150" height="90" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="365" y="338" font-size="12" font-weight="bold" fill="#1E293B" text-anchor="middle">GPU 1</text>
  <text x="365" y="360" font-size="10" fill="#475569" text-anchor="middle">W 右半 · 算一半</text>

  <line x1="262" y1="345" x2="486" y2="345" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrO)"/>
  <line x1="440" y1="345" x2="486" y2="345" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrO)"/>
  <circle cx="520" cy="345" r="28" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#glow)"/>
  <text x="520" y="354" font-size="22" fill="#1E293B" text-anchor="middle">⊕</text>
  <text x="520" y="400" font-size="11" fill="#F59E0B" text-anchor="middle">AllReduce 求和</text>
  <line x1="550" y1="345" x2="578" y2="345" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>
  <rect x="582" y="318" width="80" height="54" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="622" y="350" font-size="12" fill="#1E293B" text-anchor="middle">完整结果</text>

  <!-- ============ Q2 PP ============ -->
  <rect x="740" y="90" width="590" height="370" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="764" y="122" font-size="15" font-weight="bold" fill="#1E293B">流水线并行 PP（Pipeline Parallel）</text>
  <text x="1306" y="122" font-size="11" fill="#475569" text-anchor="end">层间切分 · 有气泡</text>

  <rect x="800" y="150" width="250" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <rect x="816" y="158" width="90" height="36" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="861" y="181" font-size="11" fill="#1E293B" text-anchor="middle">L0-L1</text>
  <rect x="916" y="158" width="90" height="36" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="961" y="181" font-size="11" fill="#1E293B" text-anchor="middle">L2-L3</text>
  <text x="1056" y="181" font-size="10" fill="#64748B">GPU 0</text>
  <rect x="800" y="214" width="250" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <rect x="816" y="222" width="90" height="36" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="861" y="245" font-size="11" fill="#1E293B" text-anchor="middle">L4-L5</text>
  <rect x="916" y="222" width="90" height="36" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="961" y="245" font-size="11" fill="#1E293B" text-anchor="middle">L6-L7</text>
  <text x="1056" y="245" font-size="10" fill="#64748B">GPU 1</text>
  <rect x="800" y="278" width="250" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <rect x="816" y="286" width="90" height="36" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="861" y="309" font-size="11" fill="#1E293B" text-anchor="middle">L0-L1</text>
  <rect x="916" y="286" width="90" height="36" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="961" y="309" font-size="11" fill="#1E293B" text-anchor="middle">L2-L3</text>
  <text x="1056" y="309" font-size="10" fill="#64748B">GPU 0</text>
  <rect x="800" y="342" width="250" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <rect x="816" y="350" width="90" height="36" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="861" y="373" font-size="11" fill="#1E293B" text-anchor="middle">L4-L5</text>
  <rect x="916" y="350" width="90" height="36" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="961" y="373" font-size="11" fill="#1E293B" text-anchor="middle">L6-L7</text>
  <text x="1056" y="373" font-size="10" fill="#64748B">GPU 1</text>

  <line x1="780" y1="150" x2="1050" y2="394" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrP)"/>
  <line x1="820" y1="150" x2="1090" y2="394" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrP)"/>
  <line x1="860" y1="150" x2="1130" y2="394" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="1140" y="240" font-size="11" fill="#7C3AED">micro-batch 流水</text>
  <rect x="1160" y="342" width="130" height="52" fill="url(#hatch)" stroke="#CBD5E1"/>
  <text x="1225" y="373" font-size="11" fill="#64748B" text-anchor="middle">bubble 空泡</text>

  <!-- ============ Q3 DP ============ -->
  <rect x="90" y="500" width="590" height="370" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="114" y="532" font-size="15" font-weight="bold" fill="#1E293B">数据并行 DP（Data Parallel）</text>
  <text x="656" y="532" font-size="11" fill="#475569" text-anchor="end">模型复制 · 请求分流</text>

  <rect x="130" y="610" width="120" height="90" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="190" y="650" font-size="12" font-weight="bold" fill="#1E293B" text-anchor="middle">Router</text>
  <text x="190" y="672" font-size="11" fill="#475569" text-anchor="middle">负载均衡</text>

  <path d="M 252,634 C 280,634 285,586 304,586" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="252" y1="655" x2="304" y2="652" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>
  <path d="M 252,676 C 280,676 285,718 304,718" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>

  <rect x="310" y="560" width="250" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="435" y="591" font-size="12" fill="#1E293B" text-anchor="middle">模型副本 0（完整复制）</text>
  <rect x="310" y="626" width="250" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="435" y="657" font-size="12" fill="#1E293B" text-anchor="middle">模型副本 1（完整复制）</text>
  <rect x="310" y="692" width="250" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="435" y="723" font-size="12" fill="#1E293B" text-anchor="middle">模型副本 2（完整复制）</text>
  <text x="310" y="776" font-size="11" fill="#475569">适合吞吐扩展：加卡即加吞吐，模型必须装进单卡</text>

  <!-- ============ Q4 EP ============ -->
  <rect x="740" y="500" width="590" height="370" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="764" y="532" font-size="15" font-weight="bold" fill="#1E293B">专家并行 EP（Expert Parallel）</text>
  <text x="1306" y="532" font-size="11" fill="#475569" text-anchor="end">MoE 专用 · token 路由</text>

  <g filter="url(#glow)">
    <rect x="800" y="560" width="220" height="44" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  </g>
  <text x="910" y="588" font-size="12" fill="#1E293B" text-anchor="middle">Router（按 token 路由）</text>

  <line x1="850" y1="604" x2="850" y2="654" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrO)"/>
  <line x1="920" y1="604" x2="962" y2="654" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrO)"/>
  <line x1="970" y1="604" x2="1078" y2="654" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrO)"/>
  <line x1="1005" y1="604" x2="1192" y2="654" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="1050" y="636" font-size="11" fill="#F59E0B">all-to-all 通信</text>

  <rect x="800" y="660" width="100" height="80" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="850" y="692" font-size="11" fill="#1E293B" text-anchor="middle">GPU 0</text>
  <text x="850" y="714" font-size="11" fill="#1E293B" text-anchor="middle">Expert 0</text>
  <rect x="915" y="660" width="100" height="80" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="965" y="692" font-size="11" fill="#1E293B" text-anchor="middle">GPU 1</text>
  <text x="965" y="714" font-size="11" fill="#1E293B" text-anchor="middle">Expert 1</text>
  <rect x="1030" y="660" width="100" height="80" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="1080" y="692" font-size="11" fill="#1E293B" text-anchor="middle">GPU 2</text>
  <text x="1080" y="714" font-size="11" fill="#1E293B" text-anchor="middle">Expert 2</text>
  <rect x="1145" y="660" width="100" height="80" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="1195" y="692" font-size="11" fill="#1E293B" text-anchor="middle">GPU 3</text>
  <text x="1195" y="714" font-size="11" fill="#1E293B" text-anchor="middle">Expert 3</text>
  <text x="800" y="776" font-size="11" fill="#475569">MoE 模型：不同专家放不同卡，token 按路由动态流动</text>

  <text x="48" y="878" font-size="11" fill="#94A3B8">四种并行正交组合：TP 切权重、PP 切层、DP 复制模型、EP 切专家——现代大模型通常多维混用</text>
</svg>
