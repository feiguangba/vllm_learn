<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.45"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#F1F5F9"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#CBD5E1" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1400" height="900" fill="#FFFFFF"/>

  <text x="48" y="52" font-size="20" font-weight="bold" fill="#1E293B">静态批处理 vs 连续批处理：GPU 空泡从何而来，又如何消除</text>

  <!-- ============ 面板 A：Static Batching ============ -->
  <rect x="80" y="78" width="1240" height="356" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="104" y="108" font-size="14" font-weight="bold" fill="#475569">① 静态批处理 Static Batching —— 整批同进同出</text>
  <text x="1296" y="120" font-size="12" fill="#94A3B8" text-anchor="end">时间 →</text>

  <!-- Req A -->
  <rect x="260" y="140" width="300" height="44" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="310" y="167" font-size="12" fill="#1E293B">Req A</text>
  <circle cx="574" cy="162" r="6" fill="#10B981"/>
  <rect x="588" y="140" width="432" height="44" fill="url(#hatch)" stroke="#E2E8F0"/>
  <!-- Req B -->
  <rect x="260" y="196" width="420" height="44" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="310" y="223" font-size="12" fill="#1E293B">Req B</text>
  <circle cx="694" cy="218" r="6" fill="#10B981"/>
  <rect x="708" y="196" width="312" height="44" fill="url(#hatch)" stroke="#E2E8F0"/>
  <!-- Req C -->
  <rect x="260" y="252" width="760" height="44" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="310" y="279" font-size="12" fill="#1E293B">Req C（最长）</text>
  <circle cx="1034" cy="274" r="6" fill="#10B981"/>
  <!-- Req D -->
  <rect x="260" y="308" width="540" height="44" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="310" y="335" font-size="12" fill="#1E293B">Req D</text>
  <circle cx="814" cy="330" r="6" fill="#10B981"/>
  <rect x="828" y="308" width="192" height="44" fill="url(#hatch)" stroke="#E2E8F0"/>
  <text x="804" y="168" font-size="12" fill="#64748B" text-anchor="middle">idle 空泡（GPU 空转）</text>

  <!-- 下一批 -->
  <rect x="1060" y="252" width="180" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-dasharray="4 3"/>
  <text x="1150" y="279" font-size="11" fill="#64748B" text-anchor="middle">下一批（排队中）</text>
  <line x1="1020" y1="120" x2="1020" y2="360" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1020" y="380" font-size="12" fill="#475569" text-anchor="middle">整批结束才进入下一批</text>

  <!-- ============ 面板 B：Continuous Batching ============ -->
  <rect x="80" y="454" width="1240" height="376" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="104" y="484" font-size="14" font-weight="bold" fill="#475569">② 连续批处理 Continuous Batching —— 迭代粒度换入换出</text>
  <text x="1296" y="496" font-size="12" fill="#94A3B8" text-anchor="end">时间 →</text>

  <!-- Req A → E -->
  <rect x="260" y="516" width="300" height="44" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="310" y="543" font-size="12" fill="#1E293B">Req A</text>
  <circle cx="574" cy="538" r="6" fill="#10B981"/>
  <rect x="588" y="516" width="392" height="44" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="636" y="543" font-size="11" fill="#1E293B">Req E（新请求立即入场）</text>
  <!-- Req B → F -->
  <rect x="260" y="572" width="420" height="44" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="310" y="599" font-size="12" fill="#1E293B">Req B</text>
  <circle cx="694" cy="594" r="6" fill="#10B981"/>
  <rect x="708" y="572" width="412" height="44" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="756" y="599" font-size="11" fill="#1E293B">Req F（立即入场）</text>
  <!-- Req C -->
  <rect x="260" y="628" width="760" height="44" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="310" y="655" font-size="12" fill="#1E293B">Req C（最长）</text>
  <circle cx="1034" cy="650" r="6" fill="#10B981"/>
  <!-- Req D → G -->
  <rect x="260" y="684" width="540" height="44" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="310" y="711" font-size="12" fill="#1E293B">Req D</text>
  <circle cx="814" cy="706" r="6" fill="#10B981"/>
  <rect x="828" y="684" width="372" height="44" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="876" y="711" font-size="11" fill="#1E293B">Req G（立即入场）</text>

  <text x="574" y="506" font-size="11" fill="#10B981" text-anchor="middle">完成 → 补位</text>

  <rect x="340" y="770" width="720" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="700" y="795" font-size="12" fill="#475569" text-anchor="middle">任何一步都有请求在跑：完成即让位，新请求即补位，无 idle 空泡</text>

  <text x="48" y="878" font-size="11" fill="#94A3B8">Continuous Batching 以迭代为粒度换入换出请求：消除队头阻塞与 GPU 空泡，同等算力下吞吐提升数倍</text>
</svg>
